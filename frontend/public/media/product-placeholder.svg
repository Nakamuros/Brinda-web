<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" role="img" aria-label="Ilustración de ejemplo: copa con un trago ámbar">
  <!-- Placeholder sintético. Reemplazar por la foto real del producto (WebP, fondo oscuro que se funda con la sección). -->
  <defs>
    <radialGradient id="halo" cx="50%" cy="38%" r="50%">
      <stop offset="0" stop-color="#e0a35a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#431821" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c27e"/>
      <stop offset="1" stop-color="#b2864f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf4e1" stop-opacity=".34"/>
      <stop offset=".5" stop-color="#fbf4e1" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fbf4e1" stop-opacity=".26"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e1" stop-opacity=".22"/>
      <stop offset="1" stop-color="#fbf4e1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <ellipse cx="400" cy="400" rx="400" ry="400" fill="url(#halo)"/>
  <!-- reflejo -->
  <g transform="translate(0 1480) scale(1 -1)" opacity=".28">
    <ellipse cx="400" cy="740" rx="130" ry="22" fill="url(#fade)"/>
    <rect x="394" y="560" width="12" height="180" fill="url(#fade)"/>
  </g>
  <!-- base y pie -->
  <ellipse cx="400" cy="740" rx="130" ry="22" fill="url(#glass)" stroke="#fbf4e1" stroke-opacity=".5" stroke-width="2"/>
  <rect x="394" y="548" width="12" height="192" fill="url(#glass)" stroke="#fbf4e1" stroke-opacity=".4" stroke-width="1.5"/>
  <!-- copa -->
  <path d="M170 300 C170 470 290 556 400 556 C510 556 630 470 630 300 Z" fill="url(#glass)" stroke="#fbf4e1" stroke-opacity=".6" stroke-width="2.5"/>
  <path d="M196 344 C204 462 298 532 400 532 C502 532 596 462 604 344 Z" fill="url(#liquid)" opacity=".92"/>
  <ellipse cx="400" cy="344" rx="204" ry="30" fill="#f2c27e"/>
  <ellipse cx="400" cy="344" rx="204" ry="30" fill="none" stroke="#fff8ed" stroke-opacity=".5" stroke-width="2"/>
  <ellipse cx="400" cy="300" rx="230" ry="38" fill="none" stroke="#fbf4e1" stroke-opacity=".7" stroke-width="2.5"/>
  <path d="M214 330 C220 420 262 480 318 508" fill="none" stroke="#fff8ed" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <!-- cáscara de naranja -->
  <path d="M520 306 C560 262 612 262 640 296" fill="none" stroke="#ca5a4e" stroke-width="9" stroke-linecap="round"/>
</svg>
