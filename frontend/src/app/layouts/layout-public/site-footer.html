<footer class="footer">
  <div class="container inner">
    <div class="id">
      <a class="brand" routerLink="/">{{ brand }}</a>
      <p class="tagline">{{ tagline }}</p>
    </div>

    <app-legal-notice kind="alcohol" />

    <p class="age"><span class="badge" aria-hidden="true">+18</span> Venta solo para mayores de 18 años.</p>

    <nav class="legal-links" aria-label="Información legal">
      <ul>
        @for (l of legalLinks; track l.path) {
          <li>
            <a class="legal-link" [routerLink]="l.path">{{ l.label }}</a>
          </li>
        }
      </ul>
    </nav>

    <a class="claims" [routerLink]="complaints.path">
      <img [src]="complaints.logo" alt="Libro de Reclamaciones" width="168" height="134" loading="lazy" decoding="async" />
    </a>

    @if (legal.noticesText) {
      <div class="notices" role="note">
        <p>{{ legal.noticesText }}</p>
      </div>
    }

    <p class="copy">{{ provider.name }} · RUC {{ provider.ruc }}</p>
    <p class="copy">© {{ year }} {{ brand }}. Todos los derechos reservados.</p>
  </div>
</footer>
