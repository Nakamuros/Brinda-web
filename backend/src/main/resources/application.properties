spring.application.name=brinda-api
spring.profiles.default=local
spring.config.import=optional:file:./.env[.properties]

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-stacktrace=never

# Aplicación: usuario con mínimo privilegio
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_APP_USER}
spring.datasource.password=${DB_APP_PASSWORD}

# Migraciones: rol dueño (DDL). Sin baseline: una base no vacía y sin historial de Flyway debe fallar, no saltarse V1/V2.
spring.flyway.user=${DB_OWNER_USER}
spring.flyway.password=${DB_OWNER_PASSWORD}
spring.flyway.locations=classpath:db/migration

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.default-property-inclusion=non_null
# Campos JSON desconocidos -> 400 (HttpMessageNotReadableException): no se aceptan datos que la API no definió.
spring.jackson.deserialization.fail-on-unknown-properties=true
# 1.5 en un campo entero se truncaba a 1 en silencio: ahora es 400.
spring.jackson.deserialization.accept-float-as-int=false

# Seguridad
# Sin esto Spring genera un usuario en memoria y escribe su clave en el log en cada arranque (no se usa: la sesión es JWT).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
brinda.jwt.secret=${JWT_SECRET}
brinda.jwt.expiration-minutes=480
brinda.jwt.cookie-name=brinda_token
brinda.jwt.cookie-secure=${COOKIE_SECURE:true}
brinda.security.cors-allowed-origins=${CORS_ALLOWED_ORIGINS}
# Proxies propios delante de la app. 1 = Render solo. Con Cloudflare delante probablemente 2: verificar (ver avances.md), nunca subir sin comprobar.
brinda.security.trusted-proxy-hops=${TRUSTED_PROXY_HOPS:1}
brinda.security.max-failed-attempts=5
brinda.security.lock-minutes=15
brinda.security.orders-per-minute=5
brinda.security.logins-per-minute=10
brinda.security.complaints-per-minute=3
brinda.security.complaint-copies-per-minute=20

# Pedidos
brinda.order.expiration-minutes=20
brinda.order.whatsapp-number=${WHATSAPP_NUMBER:}
brinda.order.yape-number=${YAPE_NUMBER:}
brinda.order.plin-number=${PLIN_NUMBER:}
# Cuenta para transferencia (vacías = "te enviaremos los datos por WhatsApp")
brinda.order.transfer-bank=${TRANSFER_BANK:}
brinda.order.transfer-account=${TRANSFER_ACCOUNT:}
brinda.order.transfer-cci=${TRANSFER_CCI:}
brinda.order.transfer-holder=${TRANSFER_HOLDER:}
# Versión de términos y privacidad guardada en cada pedido (= LEGAL.documentsUpdatedAt del frontend). Vacía = no se guarda.
brinda.order.legal-documents-version=${LEGAL_DOCUMENTS_VERSION:}
# Tope del "Delivery cobrado" al confirmar (detecta errores de tipeo)
brinda.order.max-delivery-fee=${MAX_DELIVERY_FEE:100}

# Imágenes: image_url relativo se resuelve contra esta URL base (R2/CDN/carpeta local)
brinda.images.base-url=${IMAGES_BASE_URL:}
# Fotos subidas desde el panel: carpeta del servidor (en producción, un disco PERSISTENTE) y, si la web y la API
# están en dominios distintos, la URL pública de GET /api/v1/catalog/images (sin barra final)
brinda.images.upload.dir=${IMAGES_UPLOAD_DIR:uploads}
brinda.images.upload.public-url=${IMAGES_PUBLIC_URL:}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# DNI cifrado (AES-256-GCM): clave base64 de 32 bytes
brinda.crypto.dni-key=${DNI_ENCRYPTION_KEY}

# Libro de Reclamaciones (la redacción de correos y plazos está POR CONFIRMAR con el asesor)
brinda.complaints.provider-name=BRINDA PERU SAC
brinda.complaints.provider-ruc=20616579607
# Domicilio unificado del sitio; reemplaza en la hoja el texto prerrellenado de la plantilla oficial (txtDomicilio)
brinda.complaints.provider-address=Av. Alfredo Benavides 707, int. 1403, Miraflores
# Aviso a la dueña por cada reclamo nuevo; vacío = no se avisa por correo
brinda.complaints.owner-email=${COMPLAINTS_OWNER_EMAIL:}
brinda.complaints.max-email-attempts=5
brinda.complaints.response-business-days=15
