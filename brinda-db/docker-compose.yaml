services:
  db:
    image: postgres:16
    container_name: brinda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - brinda_pgdata:/var/lib/postgresql/data
volumes:
  brinda_pgdata: